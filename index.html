  <!-- DNS prefetch: resolves form-submission host early, costs nothing -->
  <link rel="dns-prefetch" href="https://formsubmit.co" />

  <!--
    Preload LCP hero image (slide 0 = h1.webp).
    Browser fetches this before JS/CSS finish parsing → faster FCP & LCP.
    fetchpriority="high" ensures it wins over lower-priority requests.
  -->
  <link
    rel="preload"
    as="image"
    href="/images/h1-mobile.webp"
    media="(max-width: 768px)"
    fetchpriority="high"
  />
  <link
    rel="preload"
    as="image"
    href="/images/h1.webp"
    media="(min-width: 769px)"
    fetchpriority="high"
  />

  <!--
    Non-blocking Google Fonts:
    · preconnect warms up the DNS + TLS handshake
    · media="print" + onload trick loads CSS asynchronously (no render block)
    · <noscript> fallback for JS-disabled browsers
    This replaces the render-blocking @import in index.css.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap"
    />
  </noscript>
